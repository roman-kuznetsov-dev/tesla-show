name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
          

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build project
        env:
          NEXT_PUBLIC_ENABLE_LEADS: 'true'
          NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
          ADMIN_JWT_SECRET: 'dummy-secret-for-build-only-1234567890'
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright install chromium      

      - name: Setup Database & Migrations
        env:
          NEXT_PUBLIC_ENABLE_LEADS: 'true'
        run: |
          npx prisma migrate deploy
          echo "NEXT_PUBLIC_ENABLE_LEADS=true" > .env
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000" >> .env
          echo "ADMIN_PASSWORD=test123" >> .env    

      - name: Run E2E tests
        env:
          NEXT_PUBLIC_ENABLE_LEADS: 'true'
          NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
        run: npx playwright test

               