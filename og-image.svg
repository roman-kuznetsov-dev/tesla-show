<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент фона -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>

    <!-- Градиент для молнии -->
    <linearGradient id="lightning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#7B2FFF"/>
    </linearGradient>

    <!-- Свечение -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Градиент для затемнения снизу -->
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(10,10,15,0)"/>
      <stop offset="100%" stop-color="rgba(10,10,15,0.95)"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Молнии (декоративные) -->
  <g filter="url(#glow)" opacity="0.6">
    <path d="M 200 0 L 150 200 L 220 220 L 130 450 L 200 470 L 100 630"
          stroke="url(#lightning)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 950 0 L 1020 180 L 950 210 L 1050 420 L 970 440 L 1100 630"
          stroke="url(#lightning)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 600 0 L 560 150 L 620 170 L 540 350 L 610 370 L 530 550"
          stroke="#7B2FFF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Затемнение снизу -->
  <rect y="300" width="1200" height="330" fill="url(#overlay)"/>

  <!-- Логотип (замени на свой, если есть PNG) -->
  <g transform="translate(60, 60)">
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="64" fill="#00D9FF" font-weight="900">
      ⚡
    </text>
  </g>

  <!-- Название -->
  <text x="60" y="440" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#F5F5F7" letter-spacing="-1">
    Тесла шоу
  </text>
  <text x="60" y="520" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#00D9FF" letter-spacing="-1">
    Без ПРОводов
  </text>

  <!-- Подзаголовок -->
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#8B8B9A">
    Электрическое шоу с молниями на ваш праздник
  </text>

  <!-- Маленький значок в правом нижнем углу -->
  <text x="1140" y="590" font-family="Arial, sans-serif" font-size="20" fill="#8B8B9A" text-anchor="end">
    bezprovodov.ru
  </text>
</svg>